# Deploy: copy .env.example to .env, fill it in, then `docker compose up -d --build`. See DEPLOY.md.
services:
  backend:
    build: { context: ., target: backend }
    env_file: .env
    restart: unless-stopped
    expose: ["8000"]
  edge:
    build: { context: ., target: edge }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["caddy_data:/data", "caddy_config:/config"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
