# docker compose up -d --build   (reads WHISPER_TOKEN and WHISPER_DOMAIN from .env next to this file)
services:
  whisper:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    restart: unless-stopped
    environment:
      WHISPER_TOKEN: ${WHISPER_TOKEN:?set WHISPER_TOKEN in .env}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
    # No published ports: only Caddy can reach it (Docker-published ports bypass ufw).
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - whisper
    environment:
      WHISPER_DOMAIN: ${WHISPER_DOMAIN:?set WHISPER_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
